[package]
name = "app"
version = "0.7.4"
description = "ID Stack — offline ID card design and batch printing"
authors = ["Prabir Kumar Das"]
license = "MIT"
repository = "https://github.com/theprabir/id-stack-web"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-log = "2"
